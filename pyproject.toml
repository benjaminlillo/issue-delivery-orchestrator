[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-delivery-orchestrator"
version = "0.4.0"
description = "Portable issue-to-PR delivery orchestration for Codex and Superset worktrees"
requires-python = ">=3.9"

[project.scripts]
issue-delivery = "issue_delivery_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
